[package]
name = "simple_vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "25"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Detach from any enclosing cargo workspace.
[workspace]

# Inlines the SDK + app helpers into the exported entry points, so a backward
# slice of a `transfer` sees the whole function in one body (the release/opt-z
# profile outlines shared code into f-helpers, which needs interprocedural slicing).
[profile.fat]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
