# nginx in front of the editor (soroprove.service, on 127.0.0.1:8765 of the same machine).
#   cp nginx-soroprove.conf /etc/nginx/sites-enabled/soroprove && systemctl reload nginx
#   certbot --nginx -d soroprove.marziano.top        (once DNS points here)
server {
    listen 80;
    listen [::]:80;
    server_name soroprove.marziano.top;

    client_max_body_size 5M;          # uploads: a contract .wasm (the editor refuses > 4 MB)
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;     # an upload of a big contract, a long Lean check
    }

    # Vibe jobs stream their progress (server-sent events): no buffering, long reads.
    location ~ ^/vibe/[0-9a-f]+/events$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
